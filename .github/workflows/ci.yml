name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (mvn verify)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Testcontainers spins up postgres:16 containers; needs the Docker daemon
      # (preinstalled on ubuntu-latest runners).
      - name: Verify (tests + JaCoCo 80% coverage gate)
        run: mvn -B verify
        working-directory: backend

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/
          if-no-files-found: ignore

  frontend:
    name: Frontend (typecheck + lint + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: frontend

      - name: Lint
        run: npm run lint
        working-directory: frontend

      - name: Unit tests (Vitest + MSW)
        run: npm test
        working-directory: frontend

  e2e:
    name: E2E (Playwright + docker compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install Playwright deps
        run: npm ci
        working-directory: e2e

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: e2e

      # globalSetup boots docker compose (postgres + backend + frontend +
      # prometheus) with Flyway migrations, the spec rejects a patch and
      # asserts the acceptance rate drops, and teardown wipes the volume.
      - name: Run Playwright suite
        run: npx playwright test
        working-directory: e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          if-no-files-found: ignore
