services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: agentops
      POSTGRES_USER: agentops
      POSTGRES_PASSWORD: agentops
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentops -d agentops"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ../backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/agentops
      SPRING_DATASOURCE_USERNAME: agentops
      SPRING_DATASOURCE_PASSWORD: agentops
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s

  frontend:
    build:
      context: ../frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-5173}:80"

  prometheus:
    image: prom/prometheus
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    command:
      - --config.file=/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    environment:
      # Optional exporter scrape targets (host+port); jobs are dropped when
      # the host env var is empty. See infra/prometheus/entrypoint.sh.
      COPILOTGUARD_HOST: ${COPILOTGUARD_HOST:-}
      COPILOTGUARD_PORT: ${COPILOTGUARD_PORT:-9190}
      AGENTDIFF_HOST: ${AGENTDIFF_HOST:-}
      AGENTDIFF_PORT: ${AGENTDIFF_PORT:-9200}
    volumes:
      - ./prometheus/prometheus.yml.tmpl:/etc/prometheus/prometheus.yml.tmpl:ro
      - ./prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      - ./prometheus/entrypoint.sh:/entrypoint.sh:ro
    depends_on:
      - backend
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"

volumes:
  pgdata:
